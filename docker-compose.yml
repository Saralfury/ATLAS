services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: scuser
      POSTGRES_PASSWORD: scpass
      POSTGRES_DB: supply_chain
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scuser -d supply_chain"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: .
    environment:
      DATABASE_URL: postgresql://scuser:scpass@postgres:5432/supply_chain
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
